# -----------------------------------------------------------------------------
# RETRY CONFIGURATION
# -----------------------------------------------------------------------------
# timeout doubles as the OpenRouter client timeout (seconds → ms).
retry_config:
  max_retries: 2
  timeout: 600

# -----------------------------------------------------------------------------
# CACHE CONFIGURATION (optional but must be complete if present)
# -----------------------------------------------------------------------------
cache_config:
  enabled: false
  cache_ttl: 5m

# -----------------------------------------------------------------------------
# ESTIMATION PARAMETERS
# -----------------------------------------------------------------------------
avg_output_tokens: 800
